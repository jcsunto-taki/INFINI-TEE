
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | INFINI-TEE</title>

    <!-- BOOTSTRAP CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- BOOTSTRAP ICONS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CUSTOM CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page-container">

        <!-- SECTION 1: HEADER / BRANDING -->
        <header class="site-header">

    <div class="brand">
        <img src="official-logo.png" alt="INFINI-TEE Logo">

        <div class="brand-info">
            <div class="brand-title">
                <h1>INFINI-TEE</h1>
                <div class="header-line"></div>
            </div>

            <p><strong>INFINITE OPTIONS.</strong> Express yourself. Without limits.</p>
        </div>
    </div>

    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="cart.html">Cart</a>
        <a href="contact.html">Contact Info</a>
    </nav>

</header>

        <!-- SECTION 2: CONTACT US HEADING -->
        <section class="contact-heading">
            CONTACT US
        </section>


        <!-- SECTION 3: CONTACT FORM -->
        <main>

            <form id="contactForm" class="contact-form">

                <div class="form-top">

                    <div class="form-group">
                        <label for="name">NAME:</label>

                        <input
                            type="text"
                            class="form-control"
                            id="name"
                            name="name"
                            required>
                    </div>


                    <div class="form-group">
                        <label for="email">EMAIL:</label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            required>
                    </div>

                </div>


                <div class="form-group message-group">
                    <label for="message">MESSAGE:</label>

                    <textarea
                        class="form-control"
                        id="message"
                        name="message"
                        rows="5"
                        required></textarea>
                </div>


                <div class="send-container">
                    <button type="submit" class="send-button">
                        SEND
                    </button>
                </div>

            </form>

        </main>


        <!-- SECTION 4: CONTACT INFORMATION -->
        <section class="contact-info">

            <div class="info-item">
                <i class="bi bi-envelope"></i>

                <a href="mailto:weareinfinitee@gmail.com">
                    weareinfinitee@gmail.com
                </a>
            </div>


            <div class="info-item">
                <i class="bi bi-telephone"></i>

                <a href="tel:+639223334444">
                    +639223334444
                </a>
            </div>


            <div class="info-item">
                <i class="bi bi-phone"></i>

                <a href="https://www.instagram.com/weareinfiniteeofficial/">
                    @weareinfiniteeofficial
                </a>
            </div>


            <div class="info-item">
                <i class="bi bi-shop"></i>

                <a href="#">
                    Tomas Morato, Quezon City
                </a>
            </div>

        </section>

    </div>


    <!-- BOOTSTRAP JAVASCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- CUSTOM JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
